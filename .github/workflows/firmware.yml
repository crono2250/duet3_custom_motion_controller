name: Firmware build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  license-compliance:
    name: REUSE / License boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check file-level licenses
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6

  host-tests:
    name: Motion core / Host tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure tests
        run: cmake -S tests -B build/host-tests -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build tests
        run: cmake --build build/host-tests --verbose

      - name: Run tests
        run: ctest --test-dir build/host-tests --output-on-failure

  stm32g431cb:
    name: STM32G431CBT6 / Release
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Arm GNU Toolchain
        env:
          ARM_TOOLCHAIN_URL: https://developer.arm.com/-/media/Files/downloads/gnu/15.2.rel1/binrel/arm-gnu-toolchain-15.2.rel1-x86_64-arm-none-eabi.tar.xz
          ARM_TOOLCHAIN_SHA256: 597893282ac8c6ab1a4073977f2362990184599643b4c5ee34870a8215783a16
        run: |
          archive="$RUNNER_TEMP/arm-gnu-toolchain.tar.xz"
          destination="$RUNNER_TEMP/arm-gnu-toolchain"
          curl --fail --location --retry 3 --output "$archive" "$ARM_TOOLCHAIN_URL"
          echo "$ARM_TOOLCHAIN_SHA256  $archive" | sha256sum --check --strict
          mkdir --parents "$destination"
          tar --extract --xz --file "$archive" --strip-components=1 --directory "$destination"
          echo "$destination/bin" >> "$GITHUB_PATH"

      - name: Show build tool versions
        run: |
          cmake --version
          ninja --version
          arm-none-eabi-gcc --version

      - name: Configure
        run: cmake --preset ci-release

      - name: Build and verify loopback image
        run: cmake --build --preset ci-release --verbose

      - name: Configure external FDCAN image
        run: cmake --preset normal-release

      - name: Build and verify external FDCAN image
        run: cmake --build --preset normal-release --verbose

      - name: Package corresponding source
        shell: bash
        run: |
          set -euo pipefail
          source_root="$RUNNER_TEMP/corresponding-source"
          archive_root="build/distribution-artifacts"
          mkdir --parents "$source_root" "$archive_root"

          git archive --format=tar --prefix=duet3_custom_motion_controller/ \
            --output="$RUNNER_TEMP/project-source.tar" HEAD
          tar --extract --file="$RUNNER_TEMP/project-source.tar" --directory="$source_root"

          git -C build/ci-release/_deps/cmsis_core-src archive --format=tar \
            --prefix=dependencies/CMSIS_5/ --output="$RUNNER_TEMP/cmsis-core.tar" HEAD
          git -C build/ci-release/_deps/cmsis_device_g4-src archive --format=tar \
            --prefix=dependencies/cmsis-device-g4/ --output="$RUNNER_TEMP/cmsis-device-g4.tar" HEAD
          git -C build/ci-release/_deps/stm32g4_hal-src archive --format=tar \
            --prefix=dependencies/stm32g4xx-hal-driver/ --output="$RUNNER_TEMP/stm32g4-hal.tar" HEAD
          tar --extract --file="$RUNNER_TEMP/cmsis-core.tar" --directory="$source_root"
          tar --extract --file="$RUNNER_TEMP/cmsis-device-g4.tar" --directory="$source_root"
          tar --extract --file="$RUNNER_TEMP/stm32g4-hal.tar" --directory="$source_root"

          {
            echo "project_commit=$GITHUB_SHA"
            echo "cmsis_core_commit=$(git -C build/ci-release/_deps/cmsis_core-src rev-parse HEAD)"
            echo "cmsis_device_g4_commit=$(git -C build/ci-release/_deps/cmsis_device_g4-src rev-parse HEAD)"
            echo "stm32g4_hal_commit=$(git -C build/ci-release/_deps/stm32g4_hal-src rev-parse HEAD)"
          } > "$source_root/SOURCE-MANIFEST.txt"

          tar --create --gzip --file="$archive_root/openpnp-motion-corresponding-source.tar.gz" \
            --directory="$source_root" .
          sha256sum "$archive_root/openpnp-motion-corresponding-source.tar.gz" \
            > "$archive_root/openpnp-motion-corresponding-source.tar.gz.sha256"

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openpnp-motion-stm32g431cbt6
          path: |
            build/ci-release/artifacts/
            build/normal-release/artifacts/
            build/distribution-artifacts/
          if-no-files-found: error
          retention-days: 14
